{% extends "base.html" %}
{% block title %}Register - CineBook{% endblock %}
{% block content %}
<div class="card">
    <h2>Create Account</h2>
    <form method="POST" action="{{ url_for('register') }}" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="10-digit mobile number">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password">
        <small>8 to 20 characters with uppercase, lowercase, digit and special character</small>

        <button type="submit">Register</button>
    </form>
    <p class="hint">Already have an account? <a href="#">Login</a></p>
</div>
{% endblock %}
